name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Optional verified commit SHA/tag to rebuild for rollback'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    outputs:
      commit: ${{ steps.revision.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-release.mjs dist "$EXPECTED_COMMIT" --source-root .
        env:
          EXPECTED_COMMIT: ${{ steps.revision.outputs.sha }}
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-candidate
          retention-days: 90
          path: |
            dist/
            package.json
            package-lock.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  acceptance:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:deployment
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-candidate
          path: release-bundle
      - run: node scripts/verify-release.mjs release-bundle/dist "$EXPECTED_COMMIT" --source-root release-bundle
        env:
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-site-${{ needs.build.outputs.commit }}
          retention-days: 90
          path: release-bundle/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: https-acceptance
          path: test-results/
